# ============================================================
# SafePath AI — Render Infrastructure as Code (100% Free Tier)
# ============================================================

services:
  # 1. Spring Boot Core Backend Service (Public HTTPS Web Service)
  - type: web
    name: safepath-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: POSTGRES_HOST
        fromDatabase:
          name: safepath-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: safepath-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: safepath-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: safepath-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: safepath-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: ML_SERVICE_URL
        value: http://safepath-ml:8001
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # 2. FastAPI Machine Learning Service (Private Service - Internal Only)
  - type: pserv
    name: safepath-ml
    runtime: docker
    dockerfilePath: ./ml-service/Dockerfile
    dockerContext: ./ml-service
    plan: free
    region: oregon
    envVars:
      - key: ML_HOST
        value: 0.0.0.0
      - key: ML_PORT
        value: 8001
      - key: ML_LOG_LEVEL
        value: info

databases:
  # 3. Persistent Managed PostgreSQL Database
  - name: safepath-db
    plan: free
    region: oregon
    databaseName: safepath_db
    user: safepath_user
