version: '3.9'

# ============================================================
# SafePath AI — Production Docker Compose (24/7 Cloud Deployment)
# ============================================================
# Features:
#   - Automatic SSL / HTTPS via Caddy reverse proxy
#   - Database persistence across container restarts (postgres_data)
#   - Internal ML inference service (not exposed to internet)
#   - Spring Boot with container memory optimization
#   - Automated health checks and restart policies
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
# ============================================================

services:

  # ----------------------------------------------------------
  # 1. PostgreSQL 15 with PostGIS 3.4
  # ----------------------------------------------------------
  postgres:
    image: postgis/postgis:15-3.4
    container_name: safepath-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safepath_db}
      POSTGRES_USER: ${POSTGRES_USER:-safepath_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-safepath_user} -d ${POSTGRES_DB:-safepath_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - safepath-network

  # ----------------------------------------------------------
  # 2. FastAPI Machine Learning Inference Service
  # ----------------------------------------------------------
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: safepath-ml
    restart: always
    environment:
      ML_HOST: 0.0.0.0
      ML_PORT: 8001
      ML_MODEL_DIR: /app/models
      ML_LOG_LEVEL: ${ML_LOG_LEVEL:-info}
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - safepath-network

  # ----------------------------------------------------------
  # 3. Spring Boot Core Backend
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safepath-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-safepath_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-safepath_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      ML_SERVICE_URL: http://ml-service:8001
      ML_SERVICE_TIMEOUT_MS: ${ML_SERVICE_TIMEOUT_MS:-5000}
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - safepath-network

  # ----------------------------------------------------------
  # 4. Caddy Reverse Proxy with Automated Let's Encrypt SSL/HTTPS
  # ----------------------------------------------------------
  caddy:
    image: caddy:2.8-alpine
    container_name: safepath-caddy
    restart: always
    ports:
      - "80:80"   # HTTP for ACME challenges & redirect to HTTPS
      - "443:443" # Secure HTTPS traffic
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      SSL_EMAIL: ${SSL_EMAIL:-admin@safepath.ai}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # Preserves Let's Encrypt SSL certificates
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - safepath-network

# ------------------------------------------------------------
# Persistent Volumes (Survives container restarts & reboots)
# ------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

# ------------------------------------------------------------
# Isolated Internal Bridge Network
# ------------------------------------------------------------
networks:
  safepath-network:
    driver: bridge

