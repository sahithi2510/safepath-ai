version: '3.9'

# ============================================================
# SafePath AI — Docker Compose
# ============================================================
# Usage:
#   docker-compose up -d              Start all services
#   docker-compose up -d postgres     Start DB only
#   docker-compose logs -f backend    View backend logs
#   docker-compose down               Stop all services
#   docker-compose down -v            Stop and remove volumes
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL + PostGIS
  # ----------------------------------------------------------
  postgres:
    image: postgis/postgis:15-3.4
    container_name: safepath-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safepath_db}
      POSTGRES_USER: ${POSTGRES_USER:-safepath_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-safepath_user} -d ${POSTGRES_DB:-safepath_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - safepath-network

  # ----------------------------------------------------------
  # Spring Boot Backend
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safepath-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-safepath_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-safepath_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      ML_SERVICE_URL: http://ml-service:8001
      ML_SERVICE_TIMEOUT_MS: ${ML_SERVICE_TIMEOUT_MS:-5000}
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - safepath-network

  # ----------------------------------------------------------
  # FastAPI ML Service
  # ----------------------------------------------------------
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: safepath-ml
    environment:
      ML_HOST: 0.0.0.0
      ML_PORT: 8001
      ML_MODEL_DIR: /app/models
      ML_LOG_LEVEL: ${ML_LOG_LEVEL:-info}
    ports:
      # Note: In production, do NOT expose this port externally
      # Only expose for development debugging
      - "8001:8001"
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - safepath-network

# ----------------------------------------------------------
# Volumes
# ----------------------------------------------------------
volumes:
  postgres_data:
    driver: local

# ----------------------------------------------------------
# Networks
# ----------------------------------------------------------
networks:
  safepath-network:
    driver: bridge
